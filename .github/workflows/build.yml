name: Build Windows & Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish GitHub Release with built EXE, ZIP, and APK"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: "0.14.0"
  CRATE_DIR: src/ZakoProxyCLI-0.14.0

jobs:
  verify-and-frontend:
    name: Verify & Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version consistency and python scripts
        working-directory: ${{ env.CRATE_DIR }}
        run: |
          python3 scripts/check-release-version.py
          python3 -m unittest discover -s scripts -p 'test_*.py'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ZakoProxyCLI-0.14.0/web/package-lock.json

      - name: Build frontend console
        working-directory: ${{ env.CRATE_DIR }}/web
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: ${{ env.CRATE_DIR }}/web/dist
          if-no-files-found: error

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.CRATE_DIR }}

      - name: Run Rust unit and profile tests
        working-directory: ${{ env.CRATE_DIR }}
        run: |
          cargo test --locked --lib
          cargo test --locked --test multi_model

  build-windows:
    name: Build Windows (EXE + ZIP)
    runs-on: windows-latest
    needs: verify-and-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: ${{ env.CRATE_DIR }}/web/dist

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.CRATE_DIR }}
          key: win-x64

      - name: Build Rust Windows binary and DLL
        working-directory: ${{ env.CRATE_DIR }}
        run: cargo build --release --locked

      - name: Package Windows EXE and ZIP
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/pack-win.ps1 `
            -BuildDir "${{ github.workspace }}\src\ZakoProxyCLI-0.14.0" `
            -WorkDir "${{ github.workspace }}" `
            -ReleaseDir "${{ github.workspace }}\out" `
            -Version "${{ env.APP_VERSION }}"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            out/ZakoAI-Proxy-${{ env.APP_VERSION }}-Windows-x64.exe
            out/ZakoAI-Proxy-${{ env.APP_VERSION }}-Windows-x64.zip
          if-no-files-found: error

  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    needs: verify-and-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: ${{ env.CRATE_DIR }}/web/dist

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK 35 & NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.CRATE_DIR }}
          key: android-ndk

      - name: Cross-compile libzakoai.so for arm64-v8a, armeabi-v7a, x86_64
        working-directory: ${{ env.CRATE_DIR }}
        run: |
          chmod +x build-android.sh
          JNILIBS_OUT="${{ github.workspace }}/android/app/src/main/jniLibs" ./build-android.sh

      - name: Ensure signing keystore exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Stage APK artifact
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk \
            "out/ZakoAIProxy-${{ env.APP_VERSION }}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: out/ZakoAIProxy-${{ env.APP_VERSION }}-android.apk
          if-no-files-found: error

  package-release:
    name: Package & Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-android]
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: out
        run: |
          sha256sum ZakoAI-Proxy-${{ env.APP_VERSION }}-Windows-x64.exe \
            ZakoAI-Proxy-${{ env.APP_VERSION }}-Windows-x64.zip \
            ZakoAIProxy-${{ env.APP_VERSION }}-android.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ZakoAI-Proxy-${{ env.APP_VERSION }}-all
          path: out/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', env.APP_VERSION) }}
          name: ZakoAI Proxy v${{ env.APP_VERSION }}
          generate_release_notes: true
          files: |
            out/ZakoAI-Proxy-${{ env.APP_VERSION }}-Windows-x64.exe
            out/ZakoAI-Proxy-${{ env.APP_VERSION }}-Windows-x64.zip
            out/ZakoAIProxy-${{ env.APP_VERSION }}-android.apk
            out/SHA256SUMS.txt
